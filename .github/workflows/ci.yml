name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run required quality gates
        run: composer check

  package:
    name: Release archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - name: Build and verify a consumer installation
        run: |
          mkdir -p dist/package
          git archive --format=zip --output=dist/php-swisseph.zip HEAD
          unzip -q dist/php-swisseph.zip -d dist/package
          test ! -d dist/package/vendor
          test ! -d dist/package/tests
          test -f dist/package/LICENSE
          test -f dist/package/NOTICE
          composer install --working-dir=dist/package --no-dev --no-interaction --prefer-dist --no-progress
          php scripts/ci/package-smoke.php dist/package
