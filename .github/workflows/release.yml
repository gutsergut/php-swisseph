name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate and test
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer check

      - name: Build release archive
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/php-swisseph.zip HEAD
          cd dist
          sha256sum php-swisseph.zip > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Expected a semantic version tag, for example v0.1.0 or v0.1.0-alpha.1."
            exit 1
          fi
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/php-swisseph.zip dist/SHA256SUMS --verify-tag --generate-notes --title "$RELEASE_TAG" "${extra[@]}"
